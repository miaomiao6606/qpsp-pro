name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/check_public_files.py
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python examples/simulate_expression.py --permutations 99
